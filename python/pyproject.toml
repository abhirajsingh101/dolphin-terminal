[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dolphin-terminal"
version = "0.3.0"
description = "One-command, localhost-first gateway for Dolphin Terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.109,<1",
  "pillow>=10,<13",
  "uvicorn[standard]>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/abhirajsingh101/dolphin-terminal"
Documentation = "https://github.com/abhirajsingh101/dolphin-terminal/tree/main/docs"
Repository = "https://github.com/abhirajsingh101/dolphin-terminal.git"
Issues = "https://github.com/abhirajsingh101/dolphin-terminal/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
]

[project.scripts]
dolphin-terminal = "dolphin_terminal.__main__:main"
dolphin-terminal-server = "dolphin_terminal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dolphin_terminal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
