name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Dolphin Terminal release tag without the v prefix
        required: true
        default: 0.3.2

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check build twine
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: ./scripts/package-check
      - run: python -m build --outdir dist python
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
