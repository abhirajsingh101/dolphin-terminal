name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: npm ci
      - run: python -m pip install -e './python[dev]'
      - run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/check
      - run: ./scripts/security-check
        env:
          DOLPHIN_TERMINAL_NPM_AUDIT_MODE: online
      - run: docker build -t dolphin-terminal:ci .
      - run: docker run --rm --entrypoint dolphin-terminal dolphin-terminal:ci doctor --json
