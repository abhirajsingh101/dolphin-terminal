name: publish-npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Dolphin Terminal release tag without the v prefix
        required: true
        default: 0.3.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: npm ci --no-audit
      - run: npm run typecheck && npm test
      - name: Publish packages in dependency order
        run: |
          npm publish -w @dolphin-terminal/protocol
          npm publish -w @dolphin-terminal/core
          npm publish -w @dolphin-terminal/react
